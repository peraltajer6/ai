<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeremy AI Chat</title>
<style>
  body { font-family: Arial, sans-serif; display:flex; justify-content:center; }
  #ai-chat-container { max-width:500px; width:90%; margin:20px auto; display:flex; flex-direction:column; }
  #chat-box { border:1px solid #ccc; padding:10px; height:400px; overflow-y:auto; background:#f9f9f9; border-radius:8px; display:flex; flex-direction:column; }
  input { flex:1; padding:10px; border-radius:4px; border:1px solid #ccc; font-size:16px; min-height:40px; }
  button { padding:10px 15px; margin-left:5px; border-radius:4px; font-size:16px; color:white; border:none; }
  #send-btn { background:#4CAF50; }
  #clear-btn { background:red; }
</style>
</head>
<body>
<div id="ai-chat-container">
  <div id="chat-box"></div>
  <div style="display:flex; margin-top:5px;">
    <input id="user-input" type="text" placeholder="Type here...">
    <button id="send-btn">Send</button>
    <button id="clear-btn">Clear</button>
  </div>
</div>

<script>
const VERCEL_ENDPOINT = "/api/chat";

const SYSTEM_PROMPT = `
You are an AI that acts like Jeremy.
Curious, competitive, experimental, asks "what if" questions, fast short messages, logical, funny, clear, dislikes rambling, joyful.
`;

// Load memory
let messageHistory = JSON.parse(localStorage.getItem("messageHistory")) || [
  { role: "system", content: SYSTEM_PROMPT }
];

const chatBox = document.getElementById("chat-box");
const userInput = document.getElementById("user-input");
const sendBtn = document.getElementById("send-btn");
const clearBtn = document.getElementById("clear-btn");

// Display old messages
window.addEventListener("load", () => {
  messageHistory.forEach(msg => {
    if (msg.role === "user") appendMessage("You", msg.content);
    if (msg.role === "assistant") appendMessage("AI", msg.content);
  });
});

// Send message
async function sendMessage() {
  const message = userInput.value.trim();
  if (!message) return;

  appendMessage("You", message);
  userInput.value = "";
  appendMessage("AI", "…thinking…");

  messageHistory.push({ role: "user", content: message });
  localStorage.setItem("messageHistory", JSON.stringify(messageHistory));

  try {
    const response = await fetch(VERCEL_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: "gpt-3.5-mini", messages: messageHistory })
    });

    const data = await response.json();
    const aiMessage = data.choices?.[0]?.message?.content || "[No response]";
    updateLastAIMessage(aiMessage);

    messageHistory.push({ role: "assistant", content: aiMessage });
    localStorage.setItem("messageHistory", JSON.stringify(messageHistory));

  } catch (err) {
    updateLastAIMessage("[Error: Could not get a valid response]");
    console.error(err);
  }
}

function appendMessage(sender, text) {
  const div = document.createElement("div");
  div.textContent = text;
  div.style.margin = "5px 0";
  div.style.padding = "8px";
  div.style.borderRadius = "8px";
  div.style.maxWidth = "80%";
  div.style.wordWrap = "break-word";
  div.style.alignSelf = sender==="AI"?"flex-start":"flex-end";
  div.style.background = sender==="AI"?"#e0f0ff":"#d4edda";
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function updateLastAIMessage(text) {
  const messages = chatBox.querySelectorAll("div");
  for (let i=messages.length-1;i>=0;i--){
    if(messages[i].textContent==="…thinking…"){
      messages[i].textContent = text;
      messages[i].style.background="#e0f0ff";
      break;
    }
  }
  chatBox.scrollTop = chatBox.scrollHeight;
}

// Event listeners
sendBtn.addEventListener("click", sendMessage);
userInput.addEventListener("keypress", e => { if(e.key==="Enter") sendMessage(); });
clearBtn.addEventListener("click", ()=>{
  localStorage.removeItem("messageHistory");
  chatBox.innerHTML="";
  messageHistory=[{role:"system",content:SYSTEM_PROMPT}];
});
</script>
</body>
</html>
